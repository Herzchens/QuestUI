name: QuestUI Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuestUI
        uses: actions/checkout@v7
        with:
          path: questui

      - name: Checkout Vencord
        uses: actions/checkout@v7
        with:
          repository: Vendicated/Vencord
          path: vencord

      - name: Install QuestUI in Vencord
        run: |
          mkdir -p vencord/src/userplugins/QuestUI
          rsync -a --delete --exclude=.git questui/ vencord/src/userplugins/QuestUI/

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: vencord/package.json

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vencord/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Test Quest action logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/quests/actionResponses.test.ts

      - name: Test Quest action runtime logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/quests/actionSafety.test.ts

      - name: Test Claim all logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/quests/claimAll.test.ts

      - name: Test Orion command and companion logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/companion.test.ts

      - name: Test Orion control-state logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/controls.test.ts

      - name: Test Orion status/version logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/status.test.ts

      - name: Test Quest reload rotation logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/quests/reload.test.ts

      - name: Test Quest shortcut snapshot logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/quests/shortcut.test.ts

      - name: Test Orb balance logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orbs/balance.test.ts

      - name: Test Dashboard sort logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/dashboard/sort.test.ts

      - name: Test ignored Quest logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/quests/ignored.test.ts

      - name: Test notification logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/notifications/logic.test.ts

      - name: Test Event Log logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/eventLog/eventLog.test.ts

      - name: Test Orion structured Event Log logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/events.test.ts

      - name: Test Orion scheduler metadata logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/scheduler.test.ts

      - name: Test version channel logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/updates/channel.test.ts

      - name: Test Update Center release logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/updates/logic.test.ts

      - name: Test QuestUI managed updater integration
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/updates/questuiNative.test.ts

      - name: Test Orion managed updater integration
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/updates/orionNative.test.ts

      - name: Reject obsolete speculative Orion API leftovers
        run: |
          set -euo pipefail
          if grep -R -n -E 'integrationApi|orionDashboardContext' \
            --exclude-dir=.git --include='*.ts' --include='*.tsx' --include='*.md' questui; then
            echo 'Found stale/speculative Orion API integration.' >&2
            exit 1
          fi

      - name: Build Vencord
        working-directory: vencord
        run: pnpm build

      - name: Type-check Vencord
        working-directory: vencord
        run: pnpm test:ts

      - name: Verify QuestUI build contracts
        working-directory: vencord
        shell: bash
        run: |
          set -euo pipefail
          required_markers=(
            'QuestUI'
            'Adds Discord Quest shortcuts'
            'Quest Dashboard'
            '/quest-home'
            '/shop'
            'QUESTS_ENROLL_BEGIN'
            'QUESTS_CLAIM_REWARD_BEGIN'
            'Claim all'
            'QUESTS_FETCH_CURRENT_QUESTS_BEGIN'
            'VIRTUAL_CURRENCY_USER_BALANCE'
            'VirtualCurrencyStore'
            'Quest list refreshed.'
            'OrionQuests'
            'Orion Quest Version Incompatible'
            'v1.4.7'
            'Highest Orb Reward'
            'Shortest Required Time'
            'Event Log'
            'Ignored'
            'Quest ready to claim'
            'New quest available'
            'Managed source updates require Vencord desktop'
            'You are up to date'
            'You are turning off AutoUpdater, please check update manually'
            'updateOrionRelease'
          )
          for marker in "${required_markers[@]}"; do
            if ! grep -Fq "$marker" dist/renderer.js; then
              echo "Missing QuestUI renderer marker: $marker" >&2
              exit 1
            fi
          done

          for marker in getControlSnapshot subscribeControlState controlEngine controlAll controlQuest; do
            if ! grep -Fq "$marker" src/userplugins/QuestUI/src/orion/companion.ts; then
              echo "Missing QuestUI companion contract marker: $marker" >&2
              exit 1
            fi
          done
          if grep -R -n -F 'Toasts.Type.' src/userplugins/QuestUI --include='*.ts' --include='*.tsx'; then
            echo 'QuestUI must not use the removed Toasts.Type API.' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = "src/userplugins/QuestUI";
          const legacy = [];
          const walk = dir => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const file = path.join(dir, entry.name);
                  if (entry.isDirectory()) walk(file);
                  else if (/\.(?:ts|tsx)$/.test(entry.name)) {
                      const source = fs.readFileSync(file, "utf8");
                      if (/\bshowToast\s*\(\s*(?!\{)/s.test(source)) legacy.push(file);
                  }
              }
          };
          walk(root);
          if (legacy.length) {
              console.error("QuestUI must use Vencord's object-form showToast API:");
              for (const file of legacy) console.error(" - " + file);
              process.exit(1);
          }
          NODE

          grep -Fq 'Processing…' src/userplugins/QuestUI/src/quests/actions/QuestCardActions.tsx
          grep -Fq 'MAX_LOG_BYTES = 10 * 1024 * 1024' src/userplugins/QuestUI/src/eventLog/native.ts
          grep -Fq 'COMPACT_TO_BYTES = 5 * 1024 * 1024' src/userplugins/QuestUI/src/eventLog/native.ts
          grep -Fq 'QuestUI:ignored-quests:v1' src/userplugins/QuestUI/src/quests/ignored/runtime.ts
          grep -Fq 'completedQuestTransitions' src/userplugins/QuestUI/src/notifications/runtime.ts
          grep -Fq 'newAvailableQuestTransitions' src/userplugins/QuestUI/src/notifications/runtime.ts
          grep -Fq 'subscribeEventLog(scheduleProblemScan)' src/userplugins/QuestUI/src/notifications/runtime.ts
          grep -Fq 'updateOrionRelease' src/userplugins/QuestUI/src/updates/UpdateCenter.tsx
          grep -Fq 'recordManagedUpdateEvent' src/userplugins/QuestUI/src/updates/UpdateCenter.tsx
          grep -Fq 'combinedAvailabilityCopy' src/userplugins/QuestUI/src/updates/UpdateCenter.tsx
          grep -Fq 'dashboardAvailabilityLines' src/userplugins/QuestUI/src/updates/UpdateCenter.tsx
          grep -Fq 'quest-ui-dashboard-update-chip-copy' src/userplugins/QuestUI/src/updates/styles.css
          grep -Fq 'automaticChecksEnabled' src/userplugins/QuestUI/src/updates/runtime.ts
          grep -Fq 'updateTrace' src/userplugins/QuestUI/src/updates/UpdateCenter.tsx
          grep -Fq 'Update trace' src/userplugins/QuestUI/src/eventLog/EventLogViewer.tsx
          grep -Fq 'queryIdentityRef.current !== queryIdentity' src/userplugins/QuestUI/src/eventLog/EventLogViewer.tsx
          grep -Fq 'hardReset ? 120 : 0' src/userplugins/QuestUI/src/eventLog/EventLogViewer.tsx
          grep -Fq 'updateOrionRelease' src/userplugins/QuestUI/native.ts
          grep -Fq 'nyxxbit/discord-quest-completer' dist/vencordDesktopMain.js
          grep -Fq 'Automatic OrionQuests updates require the official main branch' dist/vencordDesktopMain.js
          grep -Fq 'decision-required' dist/vencordDesktopMain.js
          grep -Fq 'Discard & update' dist/renderer.js

          grep -Fq 'shouldShow={dashboardOpen}' src/userplugins/QuestUI/src/dashboard/QuestButton.tsx
          grep -Fq 'onRequestClose={closeDashboard}' src/userplugins/QuestUI/src/dashboard/QuestButton.tsx
          if grep -Fq 'popoutProps.onClick' src/userplugins/QuestUI/src/dashboard/QuestButton.tsx; then
            echo 'Quest shortcut must own HeaderBar popout visibility instead of delegating to popoutProps.onClick.' >&2
            exit 1
          fi

          grep -Fq 'useQuestSnapshot("shortcut")' src/userplugins/QuestUI/src/dashboard/QuestButton.tsx
          grep -Fq 'SHORTCUT_REFRESH_FALLBACK_MS = 60_000' src/userplugins/QuestUI/src/quests/data.ts
          grep -Fq 'sameQuestShortcutSnapshot' src/userplugins/QuestUI/src/quests/data.ts
          grep -Fq 'const quests = useQuestSnapshot();' src/userplugins/QuestUI/src/dashboard/QuestDashboard.tsx
          if grep -Fq 'const allQuests = useQuestSnapshot();' src/userplugins/QuestUI/src/dashboard/QuestButton.tsx; then
            echo 'Quest shortcut must not subscribe to the 250ms live-progress render clock.' >&2
            exit 1
          fi

      - name: Test reporter parser
        run: node questui/scripts/checkQuestUIReporter.mjs --self-test

  orion-companion:
    name: Build with OrionQuests (upstream-main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuestUI
        uses: actions/checkout@v7
        with:
          path: questui

      - name: Checkout Vencord
        uses: actions/checkout@v7
        with:
          repository: Vendicated/Vencord
          path: vencord

      - name: Checkout OrionQuests
        uses: actions/checkout@v7
        with:
          repository: nyxxbit/discord-quest-completer
          ref: main
          path: vencord/src/userplugins/discord-quest-completer

      - name: Install QuestUI beside OrionQuests
        run: |
          mkdir -p vencord/src/userplugins/QuestUI
          rsync -a --delete --exclude=.git questui/ vencord/src/userplugins/QuestUI/

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: vencord/package.json

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vencord/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Test Orion command and companion logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/companion.test.ts

      - name: Test Orion control-state logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/controls.test.ts

      - name: Test Orion status/version logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/status.test.ts

      - name: Test Orion structured Event Log logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/events.test.ts

      - name: Test Orion scheduler metadata logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/orion/scheduler.test.ts

      - name: Test Quest reload rotation logic
        working-directory: vencord
        run: pnpm exec tsx src/userplugins/QuestUI/tests/quests/reload.test.ts

      - name: Verify Orion companion source surface
        shell: bash
        run: |
          set -euo pipefail
          surface='vencord/src/userplugins/discord-quest-completer/index.tsx'
          for marker in getControlSnapshot subscribeControlState controlEngine controlAll controlQuest; do
            if ! grep -Fq "$marker" "$surface"; then
              echo "Missing Orion companion surface marker: $marker" >&2
              exit 1
            fi
          done
          for marker in subscribeEvents getSchedulerSnapshot subscribeSchedulerState; do
            if ! grep -Fq "$marker" "$surface"; then
              echo "Missing Orion optional v1.3 companion capability marker: $marker" >&2
              exit 1
            fi
          done

      - name: Build Vencord with both plugins
        working-directory: vencord
        run: pnpm build

      - name: Type-check Vencord with both plugins
        working-directory: vencord
        run: pnpm test:ts

      - name: Verify both plugins are bundled
        working-directory: vencord
        run: |
          set -euo pipefail
          grep -Fq 'QuestUI' dist/renderer.js
          grep -Fq 'OrionQuests' dist/renderer.js

  reporter:
    name: Patch Reporter (${{ matrix.discord_branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        discord_branch: [stable, canary]
    steps:
      - name: Checkout QuestUI
        uses: actions/checkout@v7
        with:
          path: questui

      - name: Checkout Vencord
        uses: actions/checkout@v7
        with:
          repository: Vendicated/Vencord
          path: vencord

      - name: Install QuestUI in Vencord
        run: |
          mkdir -p vencord/src/userplugins/QuestUI
          rsync -a --delete --exclude=.git questui/ vencord/src/userplugins/QuestUI/

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: vencord/package.json

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vencord/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Instrument QuestUI top-bar reporter target
        working-directory: vencord
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "src/webpack/patchWebpack.ts";
          let source = fs.readFileSync(path, "utf8");
          const needle = "        if (!moduleMatches) {\n            continue;\n        }\n\n        // Save the result from the previous patch so we can restore it in case a patch group fails.";
          const replacement = "        if (!moduleMatches) {\n            continue;\n        }\n\n        if (patch.plugin === \"QuestUI\" && String(patch.find).includes(\"data-window-chrome\")) {\n            const headerShape = originalFactoryCode.includes(\"leading:\")\n                && originalFactoryCode.includes(\"title:\")\n                && originalFactoryCode.includes(\"trailing:\")\n                && originalFactoryCode.includes(\"windowKey:\")\n                && originalFactoryCode.includes(\"growLeading:\");\n            console.log(\"[PUP_DEBUG]\", \"QUESTUI_TOPBAR_TARGET\", JSON.stringify({\n                moduleId: String(moduleId),\n                windowChrome: originalFactoryCode.includes(\"data-window-chrome\"),\n                headerShape\n            }));\n        }\n\n        // Save the result from the previous patch so we can restore it in case a patch group fails.";
          if (!source.includes(needle)) throw new Error("QuestUI reporter target instrumentation point not found");
          fs.writeFileSync(path, source.replace(needle, replacement));
          NODE

      - name: Build reporter
        working-directory: vencord
        run: pnpm buildReporter

      - name: Run reporter and validate QuestUI
        timeout-minutes: 10
        working-directory: vencord
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          export CHROMIUM_BIN=/usr/bin/google-chrome

          test -x "$CHROMIUM_BIN"
          esbuild scripts/generateReport.ts > dist/report.mjs

          report_file="$RUNNER_TEMP/questui-${{ matrix.discord_branch }}-report.md"
          stderr_file="$RUNNER_TEMP/questui-${{ matrix.discord_branch }}-stderr.log"

          set +e
          if [ "${{ matrix.discord_branch }}" = "canary" ]; then
            USE_CANARY=true node dist/report.mjs >"$report_file" 2>"$stderr_file"
          else
            node dist/report.mjs >"$report_file" 2>"$stderr_file"
          fi
          reporter_exit=$?
          set -e

          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$stderr_file" ]; then
            {
              echo
              echo '<details><summary>Reporter stderr</summary>'
              echo
              echo '```text'
              cat "$stderr_file"
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          node "$GITHUB_WORKSPACE/questui/scripts/checkQuestUIReporter.mjs" \
            "$report_file" "$stderr_file" "$reporter_exit" --require-topbar-target
